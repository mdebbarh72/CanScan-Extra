
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
  AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
  MLFLOW_TRACKING_URI: http://mlflow:5000

x-airflow-volumes: &airflow-volumes
  - ./airflow/dags:/opt/airflow/dags
  - ./airflow/logs:/opt/airflow/logs
  - ./airflow/plugins:/opt/airflow/plugins
  - ./models:/opt/airflow/models:ro

services:
  # FastAPI
  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_started
    restart: unless-stopped

  # Streamlit
  streamlit:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  # Airflow PostgreSQL
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Airflow initialization
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    environment: *airflow-env
    volumes: *airflow-volumes
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username admin \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Mohammed \
          --lastname Admin \
          --role Admin \
          --email admin@example.com
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  # Airflow API server
  airflow-api-server:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: api-server
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Airflow scheduler
  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: scheduler
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Airflow DAG processor
  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: dag-processor
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Airflow triggerer
  airflow-triggerer:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    command: triggerer
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # MLflow PostgreSQL
  mlflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: mlflow
    volumes:
      - mlflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MLflow tracking server
  mlflow:
    build:
      context: .
      dockerfile: mlflow/Dockerfile
    environment:
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
    ports:
      - "5000:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      mlflow-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  airflow-db-data:
  mlflow-db-data:
  mlflow-artifacts:
